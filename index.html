<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Fi-Weath</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
   </head>
   <body class="bg-primary vh-100 w-100">
      <section class="container h-100 d-flex justify-content-center align-items-center text-white">
         <div class="border px-5 py-4 shadow-lg rounded bg-dark">
            <header class="py-3 text-white border-bottom text-center">
               <h4>Fi-Weath</h4>
            </header>
            <div class="d-flex bg-white btn btn-outline-none">
               <input
                  class="h-100 py-2 bg-transparent btn btn-outline-none"
                  type="text"
                  id="search"
                  placeholder="Search By City ..."
               />
               <button class="bg-transparent btn border" onclick="fetchWeather()">Q</button>
            </div>
         </div>
      </section>

      <script src="script.js"></script>
      <script
         src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
         integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
         crossorigin="anonymous"
      ></script>
   </body>
</html>
