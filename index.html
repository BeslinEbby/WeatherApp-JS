<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Fi-Weath</title>
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
   </head>
   <body class="bg-primary vh-100 w-100">
      <section class="container h-100 d-flex justify-content-center align-items-center text-white">
         <div class="border px-5 py-4 shadow-lg rounded bg-dark">
            <header class="py-3 text-white border-bottom text-center">
               <h4>Fi-Weath</h4>
            </header>
            <div class="d-flex bg-white btn btn-outline-none">
               <input
                  class="h-100 py-2 bg-transparent btn btn-outline-none"
                  type="text"
                  id="search"
                  placeholder="Search By City ..."
               />
               <button class="bg-transparent btn border" onclick="fetchWeather()">Q</button>
            </div>
            <div class="d-flex flex-column justify-content-center align-items-center mt-5">
               <h4 id="city"></h4>
               <div class="d-flex gap-1">
                  <h2 id="temp"></h2>
                  <span class="fs-5">&deg C</span>
               </div>
               <img style="width: 120px; height: 120px" id="icon" src="" alt="" />
               <h5 id="weather"></h5>
               <div class="d-flex justify-content-between w-100 mt-2">
                  <div class="d-flex flex-column align-items-center gap-2">
                     <span>Humidity</span>
                     <span id="hum"></span>
                  </div>
                  <div class="d-flex flex-column align-items-center gap-2">
                     <span>Wind Speed</span>
                     <span id="wind"></span>
                  </div>
               </div>
            </div>
         </div>
      </section>

      <script src="script.js"></script>
      <script
         src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
         integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
         crossorigin="anonymous"
      ></script>
   </body>
</html>
